services:
  - type: web
    name: atbriz-django
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn atbriz.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: atbriz-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.13.0

databases:
  - name: atbriz-db
    databaseName: atbriz
    user: atbriz_user
