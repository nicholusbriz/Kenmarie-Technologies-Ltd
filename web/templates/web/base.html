{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard - Kenmarie Technologies{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="dashboard-container">
        <!-- Overlay Backdrop -->
        <div class="overlay" id="overlay"></div>

        <!-- Floating Hamburger Button -->
        <button class="hamburger-menu" id="hamburgerBtn">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2 class="sidebar-logo">Kenmarie Technologies</h2>
            </div>
            
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="/web/" class="nav-link active">Dashboard</a></li>
                    <li><a href="/web/projects/" class="nav-link">My Projects</a></li>
                    <li><a href="/web/deployments/" class="nav-link">Deployments</a></li>
                    <li><a href="/web/settings/" class="nav-link">Settings</a></li>
                    <li><a href="/web/github/" class="nav-link">GitHub Integration</a></li>
                </ul>
            </nav>

            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar">
                        <span>U</span>
                    </div>
                    <div class="user-details">
                        <p class="user-name">User</p>
                        <p class="user-email">user@example.com</p>
                    </div>
                </div>
                <a href="/" class="logout-btn">Back to Home</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script>
        // Mobile sidebar toggle
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        hamburgerBtn.addEventListener('click', () => {
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        });

        overlay.addEventListener('click', () => {
            sidebar.classList.remove('active');
            overlay.classList.remove('active');
        });
    </script>
</body>
</html>
